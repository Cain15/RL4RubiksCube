<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rubik's cube replay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #e8e8e8;
               font: 14px system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .bar { position: fixed; left: 0; right: 0; padding: 10px 14px; display: flex; gap: 10px;
         align-items: center; flex-wrap: wrap; background: rgba(20,22,26,.85); }
  #top { top: 0; } #bottom { bottom: 0; }
  button, select, input[type=file]::file-selector-button {
    background: #2a2e36; color: inherit; border: 1px solid #3b414c; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { background: #343944; }
  #slider { flex: 1; min-width: 160px; }
  #hud { position: fixed; top: 64px; left: 14px; line-height: 1.6; pointer-events: none; }
  #move { font-size: 38px; font-weight: 600; }
  #solved { color: #5be37d; font-weight: 600; font-size: 18px; }
  .dim { color: #9aa0ab; }
</style>
</head>
<body>
<div id="view"></div>

<div class="bar" id="top">
  <label>Log: <input type="file" id="file" accept=".jsonl,.json,.txt"></label>
  <label>Episode: <select id="episode"></select></label>
  <span class="dim" id="msg"></span>
</div>

<div id="hud">
  <div id="move">&nbsp;</div>
  <div id="info" class="dim"></div>
  <div id="solved"></div>
</div>

<div class="bar" id="bottom">
  <button id="first" title="Back to start (Home)">⏮</button>
  <button id="prev"  title="Step back (←)">◀</button>
  <button id="play"  title="Play / pause (space)">▶ Play</button>
  <button id="next"  title="Step forward (→)">▶|</button>
  <button id="last"  title="Jump to end (End)">⏭</button>
  <input type="range" id="slider" min="0" max="0" value="0">
  <label>Speed
    <select id="speed">
      <option value="0.5">0.5×</option><option value="1" selected>1×</option>
      <option value="2">2×</option><option value="4">4×</option><option value="10">10×</option>
    </select>
  </label>
</div>

<!-- Pinned, >2 weeks old release from an allowed CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Python's Cube.py can inject a log here (see cube_log.build_viewer); otherwise null.
const EMBEDDED_LOG = /*__EMBEDDED_LOG__*/ null;

// ==== CORE (depends only on THREE; also tested headlessly against the Python Cube) ====
const FACES = "URFDLB";
const ACTION_NAMES = [...FACES].concat([...FACES].map(f => f + "'"));
const NORMALS = { U:[0,1,0], R:[1,0,0], F:[0,0,1], D:[0,-1,0], L:[-1,0,0], B:[0,0,-1] };
const COLORS = [0xffffff, 0xd32f2f, 0x2e7d32, 0xfbc02d, 0xf57c00, 0x1565c0]; // U R F D L B

// Same conventions as cube.py: x right, y up, z towards F; a clockwise turn is -90 deg about
// the outward face normal.
function buildCube(cubeGroup) {
  const cubies = [];
  const body = new THREE.BoxGeometry(0.97, 0.97, 0.97);
  const bodyMat = new THREE.MeshBasicMaterial({ color: 0x0b0b0d });
  const plane = new THREE.PlaneGeometry(0.86, 0.86);
  const mats = COLORS.map(c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
  for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
    const cubie = new THREE.Group();
    cubie.add(new THREE.Mesh(body, bodyMat));
    cubie.position.set(x, y, z);
    FACES.split("").forEach((f, ci) => {
      const n = NORMALS[f];
      if (n[0] * x + n[1] * y + n[2] * z !== 1) return;      // no sticker on this side
      const s = new THREE.Mesh(plane, mats[ci]);
      const nv = new THREE.Vector3(...n);
      s.position.copy(nv).multiplyScalar(0.486);
      s.lookAt(nv);                                           // plane normal = +z -> nv
      s.userData = { color: ci, normal: nv.clone() };
      cubie.add(s);
    });
    cubeGroup.add(cubie);
    cubies.push(cubie);
  }
  return cubies;
}

function resetCube(cubies) {                                  // back to the solved arrangement
  let i = 0;
  for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
    const c = cubies[i++];
    c.position.set(x, y, z);
    c.quaternion.identity();
    c.updateMatrix();
  }
}

function moveSpec(action) {
  const n = NORMALS[FACES[action % 6]];
  const axis = new THREE.Vector3(...n);
  const angle = (action < 6 ? -1 : 1) * Math.PI / 2;           // cw = -90, ccw = +90
  return { axis, angle };
}

function layerOf(cubies, axis) {
  return cubies.filter(c => Math.round(c.position.dot(axis)) === 1);
}

function snap(c) {                                             // remove float drift
  c.position.set(Math.round(c.position.x), Math.round(c.position.y), Math.round(c.position.z));
  const m = new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);
  m.elements = m.elements.map(v => Math.round(v));
  c.quaternion.setFromRotationMatrix(m);
  c.updateMatrix();
}

function finishMove(cubeGroup, pivot, layer, axis, angle) {
  pivot.quaternion.setFromAxisAngle(axis, angle);
  layer.forEach(c => cubeGroup.attach(c));
  pivot.quaternion.identity();
  layer.forEach(snap);
}

function beginMove(cubeGroup, pivot, cubies, action) {
  const { axis, angle } = moveSpec(action);
  const layer = layerOf(cubies, axis);
  pivot.quaternion.identity();
  pivot.updateMatrixWorld(true);
  layer.forEach(c => pivot.attach(c));
  return { axis, angle, layer };
}

function applyMoveInstant(cubeGroup, pivot, cubies, action) {
  const m = beginMove(cubeGroup, pivot, cubies, action);
  finishMove(cubeGroup, pivot, m.layer, m.axis, m.angle);
}

// Same indexing as cube.py::_sticker_index
function stickerIndex(p, n) {
  const [x, y, z] = p; let f, row, col;
  if (n[1] === 1)       { f = 0; row = z + 1; col = x + 1; }
  else if (n[0] === 1)  { f = 1; row = 1 - y; col = 1 - z; }
  else if (n[2] === 1)  { f = 2; row = 1 - y; col = x + 1; }
  else if (n[1] === -1) { f = 3; row = 1 - z; col = x + 1; }
  else if (n[0] === -1) { f = 4; row = 1 - y; col = z + 1; }
  else                  { f = 5; row = 1 - y; col = 1 - x; }
  return f * 9 + row * 3 + col;
}

function readState(cubies) {                                   // 54 colour ints, like Cube.state
  const state = new Array(54).fill(-1);
  cubies.forEach(c => {
    c.updateMatrix();
    c.children.forEach(s => {
      if (!s.userData.normal) return;
      const wn = s.userData.normal.clone().applyQuaternion(c.quaternion);
      const n = [Math.round(wn.x), Math.round(wn.y), Math.round(wn.z)];
      const p = [Math.round(c.position.x), Math.round(c.position.y), Math.round(c.position.z)];
      state[stickerIndex(p, n)] = s.userData.color;
    });
  });
  return state;
}
// ==== END CORE ====

// ---------- log parsing ----------
// JSON lines: {"type":"reset","episode":0,"scramble":[3,5,..]} and
//             {"type":"step","episode":0,"action":1,"reward":-0.01}
function parseLog(text) {
  const episodes = [];
  let cur = null;
  for (const line of text.split(/\r?\n/)) {
    const t = line.trim();
    if (!t) continue;
    let o; try { o = JSON.parse(t); } catch { continue; }      // ignore a partially written line
    if (o.type === "reset") {
      cur = { id: o.episode ?? episodes.length, scramble: o.scramble || [], steps: [] };
      episodes.push(cur);
    } else if (o.action !== undefined) {
      if (!cur) { cur = { id: 0, scramble: [], steps: [] }; episodes.push(cur); }
      cur.steps.push({ a: o.action, r: o.reward });
    }
  }
  return episodes;
}

// ---------- scene ----------
const container = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(5.2, 4.4, 6.6);
camera.lookAt(0, 0, 0);

const world = new THREE.Group();            // dragged with the mouse
scene.add(world);
world.rotation.set(0.0, 0.0, 0.0);
const cubeGroup = new THREE.Group();
world.add(cubeGroup);
const pivot = new THREE.Group();
cubeGroup.add(pivot);
const cubies = buildCube(cubeGroup);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize); resize();

(function loop() { renderer.render(scene, camera); requestAnimationFrame(loop); })();

// mouse / touch orbit
let drag = null;
renderer.domElement.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; });
window.addEventListener("pointerup", () => { drag = null; });
window.addEventListener("pointermove", e => {
  if (!drag) return;
  world.rotation.y += (e.clientX - drag[0]) * 0.008;
  world.rotation.x += (e.clientY - drag[1]) * 0.008;
  world.rotation.x = Math.max(-1.5, Math.min(1.5, world.rotation.x));
  drag = [e.clientX, e.clientY];
});

// ---------- playback ----------
const $ = id => document.getElementById(id);
let episodes = [], ep = null, pos = 0, playing = false, token = 0, busy = false;

const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const speed = () => parseFloat($("speed").value);
const inverse = a => (a + 6) % 12;

function animateMove(action) {
  const ms = 450 / speed();
  const m = beginMove(cubeGroup, pivot, cubies, action);
  return new Promise(resolve => {
    const t0 = performance.now();
    (function tick(now) {
      const t = Math.min(1, (now - t0) / ms);
      pivot.quaternion.setFromAxisAngle(m.axis, m.angle * ease(t));
      if (t < 1) requestAnimationFrame(tick);
      else { finishMove(cubeGroup, pivot, m.layer, m.axis, m.angle); resolve(); }
    })(performance.now());
  });
}

function refreshHud(lastAction) {
  const n = ep ? ep.steps.length : 0;
  $("slider").max = n; $("slider").value = pos;
  $("move").textContent = lastAction === undefined ? "\u00a0" : ACTION_NAMES[lastAction];
  const r = ep && pos > 0 ? ep.steps[pos - 1].r : undefined;
  $("info").textContent = ep
    ? `episode ${ep.id}  ·  step ${pos} / ${n}` + (r !== undefined ? `  ·  reward ${r}` : "") +
      (ep.scramble.length ? `  ·  scramble length ${ep.scramble.length}` : "")
    : "";
  const s = readState(cubies);
  $("solved").textContent = s.every((c, i) => c === Math.floor(i / 9)) ? "SOLVED ✓" : "";
}

function goTo(k) {                                              // instant jump
  token++; busy = false;
  resetCube(cubies);
  ep.scramble.forEach(a => applyMoveInstant(cubeGroup, pivot, cubies, a));
  for (let i = 0; i < k; i++) applyMoveInstant(cubeGroup, pivot, cubies, ep.steps[i].a);
  pos = k;
  refreshHud(k > 0 ? ep.steps[k - 1].a : undefined);
}

async function stepForward() {
  if (!ep || busy || pos >= ep.steps.length) return false;
  busy = true; const my = token;
  const a = ep.steps[pos].a;
  await animateMove(a);
  if (my !== token) return false;                               // a jump happened meanwhile
  pos++; busy = false; refreshHud(a); return true;
}

async function stepBack() {
  if (!ep || busy || pos <= 0) return false;
  busy = true; const my = token;
  const a = ep.steps[pos - 1].a;
  await animateMove(inverse(a));
  if (my !== token) return false;
  pos--; busy = false;
  refreshHud(pos > 0 ? ep.steps[pos - 1].a : undefined); return true;
}

async function play() {
  if (!ep) return;
  if (pos >= ep.steps.length) goTo(0);
  playing = true; $("play").textContent = "⏸ Pause";
  const my = token;
  while (playing && my === token && pos < ep.steps.length) {
    if (!(await stepForward())) break;
    await new Promise(r => setTimeout(r, 120 / speed()));
  }
  if (my === token || !playing) { playing = false; $("play").textContent = "▶ Play"; }
}
function pause() { playing = false; $("play").textContent = "▶ Play"; }

function loadEpisodes(list, msg) {
  episodes = list;
  $("episode").innerHTML = episodes.map((e, i) => `<option value="${i}">${e.id} (${e.steps.length} steps)</option>`).join("");
  $("msg").textContent = msg || `${episodes.length} episode(s)`;
  if (episodes.length) selectEpisode(0);
}
function selectEpisode(i) { pause(); token++; busy = false; ep = episodes[i]; goTo(0); }

// ---------- wiring ----------
$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  loadEpisodes(parseLog(await f.text()), f.name);
});
$("episode").addEventListener("change", e => selectEpisode(+e.target.value));
$("play").onclick = () => playing ? pause() : play();
$("next").onclick = () => { pause(); stepForward(); };
$("prev").onclick = () => { pause(); stepBack(); };
$("first").onclick = () => { pause(); if (ep) goTo(0); };
$("last").onclick = () => { pause(); if (ep) goTo(ep.steps.length); };
$("slider").addEventListener("input", e => { pause(); if (ep) goTo(+e.target.value); });
window.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  else if (e.code === "ArrowRight") $("next").click();
  else if (e.code === "ArrowLeft") $("prev").click();
  else if (e.code === "Home") $("first").click();
  else if (e.code === "End") $("last").click();
});

if (EMBEDDED_LOG) loadEpisodes(parseLog(EMBEDDED_LOG), "embedded log");
else $("msg").textContent = "Choose a .jsonl log file to replay";
</script>
</body>
</html>
